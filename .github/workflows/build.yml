name: Build · Push · Deploy

on:
  push:
    branches: [master]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION:     southamerica-east1
  AR_REPO:    bio-platform
  CLUSTER:    rizoma
  NAMESPACE:  bioinformatica

jobs:
  # ── Build e push das imagens ───────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # obrigatório para Workload Identity Federation

    strategy:
      fail-fast: false
      matrix:
        include:
          - service:    api
            context:    api
            dockerfile: api/Dockerfile
            image:      bio-platform-api

          - service:    r-worker
            context:    r-worker
            dockerfile: r-worker/Dockerfile
            image:      bio-platform-rworker

          - service:    postgres
            context:    .
            dockerfile: db/Dockerfile
            image:      bio-platform-postgres

    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation — sem service account key em secrets
      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}   # terraform output workload_identity_provider
          service_account:            ${{ vars.GCP_CI_SA }}           # terraform output github_actions_sa

      - name: Configure Docker → Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       true
          tags:       ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.image }}:latest
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.image }}:cache
          cache-to:   type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.image }}:cache,mode=max

  # ── Deploy no GKE ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy GKE
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account:            ${{ vars.GCP_CI_SA }}

      - name: Configurar kubectl
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location:     ${{ env.REGION }}

      - name: Deploy api
        run: |
          kubectl set image deployment/bio-api \
            bio-api=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/bio-platform-api:latest \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/bio-api -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Deploy r-worker
        run: |
          kubectl set image deployment/bio-r-worker \
            bio-r-worker=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/bio-platform-rworker:latest \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/bio-r-worker -n ${{ env.NAMESPACE }} --timeout=300s
