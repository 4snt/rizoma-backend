name: Build & Deploy (AWS)

on:
  push:
    branches: [master]
  workflow_dispatch:

# Variáveis de repositório/ambiente esperadas (Settings → Secrets and variables):
#   Secrets:
#     AWS_ROLE_ARN        role IAM assumida via OIDC (push ECR + deploy ECS)
#   Variables:
#     AWS_REGION          ex: us-east-1
#     ECR_REGISTRY        ex: 123456789012.dkr.ecr.us-east-1.amazonaws.com
#     ECS_CLUSTER         ex: rizoma-prod
#     NEXT_PUBLIC_API_URL ex: https://rizoma.exemplo.com  (output do Terraform)
#     NEXT_PUBLIC_WS_URL  ex: wss://rizoma.exemplo.com
#
# O ECS_CLUSTER, os nomes de repositório ECR (rizoma/api, rizoma/rworker,
# rizoma/frontend) e a role vêm do Terraform em infra/terraform.

permissions:
  contents: read
  id-token: write   # OIDC para assumir a role AWS sem chaves estáticas

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: api
            dockerfile: api/Dockerfile
            repo: rizoma/api
            ecs_service: api
          - service: r-worker
            context: r-worker
            dockerfile: r-worker/Dockerfile
            repo: rizoma/rworker
            ecs_service: rworker
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            repo: rizoma/frontend
            ecs_service: frontend

    steps:
      - uses: actions/checkout@v4

      # O frontend mora em outro repo (4snt/rizoma); clona no lugar de frontend/.
      - name: Checkout do frontend
        if: matrix.service == 'frontend'
        uses: actions/checkout@v4
        with:
          repository: 4snt/rizoma
          token: ${{ secrets.GITHUB_TOKEN }}
          path: frontend

      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_* só têm efeito no frontend (baked em build-time). Nos
      # Dockerfiles de api/r-worker esses ARGs são ignorados (apenas um warning).
      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:latest
            ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:cache,mode=max

      # Novo deployment na service correspondente. A task definition aponta para
      # :latest; --force-new-deployment puxa a imagem recém-publicada.
      - name: Deploy no ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ matrix.ecs_service }}" \
            --force-new-deployment \
            --no-cli-pager
