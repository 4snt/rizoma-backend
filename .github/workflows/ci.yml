name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: pytest + bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      # PostGIS, não postgres puro: o schema usa geography(Point) nas amostras
      # e eventos de custódia.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rizoma
          POSTGRES_USER: api_user
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api_user -d rizoma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # MinIO NÃO entra como service container: a imagem oficial exige o argumento
    # `server /data`, que a sintaxe de `services:` não permite passar. Sobe num
    # step com `docker run` (abaixo), que aceita o comando.

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rizoma
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: changeme
      APP_DB_USER: rizoma_app
      APP_DB_PASSWORD: rizoma_app_pw
      SYSTEM_DB_USER: rizoma_system
      SYSTEM_DB_PASSWORD: rizoma_system_pw
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: rizoma
      S3_SECRET_KEY: rizoma123
      S3_BUCKET: rizoma
      JWT_SECRET: ci-secret-nao-usar-em-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov bandit

      - name: Subir o MinIO e criar o bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rizoma -e MINIO_ROOT_PASSWORD=rizoma123 \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then echo "minio ok"; break; fi
            sleep 2
          done
          # Cria o bucket explicitamente — não dá para depender da ordem dos
          # testes para que algum chame ensure_bucket() antes de um put_object.
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set local http://localhost:9000 rizoma rizoma123 && \
             mc mb --ignore-existing local/rizoma"

      - name: Aplicar migrations (Alembic cria schema + papéis rizoma_app/system)
        run: alembic upgrade head

      - name: Testes (unit + integração + mvp, contra Postgres e MinIO reais)
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Análise de segurança (bandit)
        run: bandit -r app -ll || true   # não bloqueia o build; reporta findings
