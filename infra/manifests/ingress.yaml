# Ingress GKE — HTTPS gerenciado pelo Google (ManagedCertificate)
# Frontend (Next.js) roda no Vercel — este ingress expõe somente a API.

apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: bio-api-cert
  namespace: bioinformatica
spec:
  domains:
    - bioapi.seu-dominio.com   # substitua pelo valor de var.api_external_domain

---
# IP estático para o Load Balancer (crie antes: gcloud compute addresses create bio-api-ip --global)
apiVersion: v1
kind: Service
metadata:
  name: bio-api-lb
  namespace: bioinformatica
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector:
    app: bio-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bio-ingress
  namespace: bioinformatica
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "bio-api-cert"
    kubernetes.io/ingress.global-static-ip-name: "bio-api-ip"  # IP criado via gcloud
    # Timeouts longos para WebSocket e uploads de FASTQ
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - host: bioapi.seu-dominio.com   # substitua pelo var.api_external_domain
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: bio-api-lb
                port:
                  number: 80
